[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "training-server-acceptance"
version = "0.1.0"
description = "Пульт испытаний сервера обучения Energomera (временный UI для приёмки текущего API)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.36",
    "httpx>=0.27",
    "loguru>=0.7",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
include = ["client*", "lib*", "acceptance*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["acceptance_data"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: тесты против живого стенда (требуют TRAINING_SERVER_BASE_URL)",
    "smoke: смоук-тесты Streamlit-приложения (AppTest)",
]
